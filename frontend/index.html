<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivateMind — Your second brain</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f4f8fd;
  --navy: #0b1f33;
  --muted: #475569;
  --muted-light: #64748b;
  --line: #dce7f3;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-light: #e8f2ff;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --shadow: 0 16px 45px rgba(39, 86, 132, 0.08);
  --shadow-sm: 0 4px 16px rgba(39, 86, 132, 0.05);
}

* {
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  background: radial-gradient(circle at 90% 0%, rgba(56, 189, 248, 0.12), transparent 30%), var(--bg);
  color: var(--navy);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}

button, input, textarea, select {
  font-family: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.app {
  min-height: 100vh;
  display: flex;
  position: relative;
}

/* --- Sidebar --- */
.sidebar {
  width: 250px;
  flex: 0 0 250px;
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  background: rgba(255, 255, 255, 0.75);
  border-right: 1px solid rgba(197, 216, 235, 0.75);
  backdrop-filter: blur(18px);
  z-index: 30;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(11, 31, 51, 0.35);
  backdrop-filter: blur(4px);
  z-index: 40;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.sidebar-overlay.open {
  display: block;
  opacity: 1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 26px;
}

.logo {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--blue);
  background: #e7f1ff;
  flex-shrink: 0;
}

.brand b {
  display: block;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand small, .profile small {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.nav {
  display: grid;
  gap: 6px;
}

.nav button {
  border: 0;
  background: transparent;
  color: #334155;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  text-align: left;
  font-weight: 600;
  font-size: 14px;
  min-height: 44px;
  transition: background 0.15s, color 0.15s;
}

.nav button:hover, .nav button.active {
  background: #dceaff;
  color: var(--blue);
}

.nav button.active {
  box-shadow: inset 3px 0 var(--blue);
}

.profile-wrap {
  margin-top: auto;
  padding-top: 16px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border: 1px solid #e1ebf5;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 12px;
}

.avatar {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}

.profile div:nth-child(2) {
  flex: 1;
  min-width: 0;
}

.profile b {
  display: block;
  font-size: 14px;
  font-weight: 600;
}

.note {
  color: var(--muted);
  font-size: 13px;
  margin: 10px 8px 0;
  font-weight: 500;
}

/* --- Header / Top Bar --- */
.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.top {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 32px;
  border-bottom: 1px solid rgba(207, 224, 241, 0.75);
  background: rgba(244, 248, 253, 0.7);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 20;
}

.mobile-menu-btn {
  display: none;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  border: 1px solid #dce7f3;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 10px;
  color: #334155;
  cursor: pointer;
  font-size: 20px;
  flex-shrink: 0;
}

.mobile-menu-btn:hover {
  background: #e6f0ff;
  color: var(--blue);
}

.heading {
  display: flex;
  align-items: center;
  gap: 14px;
}

.heading-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--blue);
  background: #deebff;
  flex-shrink: 0;
}

.heading h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin: 0;
}

.heading p {
  color: var(--muted);
  font-size: 13px;
  margin: 2px 0 0;
  font-weight: 400;
}

.tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 240px;
  height: 40px;
  padding: 0 14px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #dfeaf5;
  border-radius: 10px;
  color: #64748b;
  font-size: 14px;
}

.icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  color: #64748b;
  font-size: 16px;
  transition: all 0.15s;
}

.icon:hover {
  background: #e5effb;
  color: var(--blue);
  border-color: #dce7f3;
}

/* --- Content & Layout Container --- */
.content {
  padding: 28px 32px 48px;
  max-width: 1680px;
  width: 100%;
  margin: 0 auto;
}

.page-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 24px;
}

.eyebrow {
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 12px;
  font-weight: 700;
  margin: 0;
}

.page-row h2, .section h2 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.25;
  margin: 4px 0 0;
}

.section h2 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* --- Buttons --- */
.primary, .secondary, .danger {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 10px;
  padding: 0 18px;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.15s;
}

.primary {
  background: var(--blue);
  color: white;
  border: 0;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.2);
}

.primary:hover {
  background: var(--blue-hover);
  transform: translateY(-1px);
}

.secondary {
  color: #334155;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #cbd5e1;
}

.secondary:hover {
  background: #ffffff;
  border-color: #94a3b8;
}

.danger {
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
}

.danger:hover {
  background: #fee2e2;
}

/* --- Stats Grid --- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 76px;
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid #e0ebf5;
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
}

.stat-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  font-size: 18px;
  flex-shrink: 0;
}

.blue { color: #2563eb; background: #e6f0ff; }
.teal { color: #0d9488; background: #e0f6f0; }
.rose { color: #e11d48; background: #ffe4e6; }
.violet { color: #7c3aed; background: #ede9fe; }
.amber { color: #d97706; background: #fef3c7; }

.stat span, .stat b { display: block; }
.stat span { color: var(--muted); font-size: 13px; font-weight: 500; }
.stat b { font-size: 22px; font-weight: 700; margin-top: 2px; }

.section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.section .link {
  border: 0;
  background: transparent;
  color: var(--blue);
  font-size: 14px;
  font-weight: 600;
  padding: 6px 10px;
}

.section .link:hover {
  text-decoration: underline;
}

/* --- AI Workspace Layout --- */
.workspace {
  height: calc(100vh - 76px);
  min-height: 600px;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  padding: 16px 32px 20px;
  max-width: 1680px;
  width: 100%;
  margin: 0 auto;
}

.history {
  padding: 16px 14px;
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid #dfeaf5;
  border-radius: 16px 0 0 16px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.new {
  width: 100%;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 22px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);
  transition: background 0.15s;
}

.new:hover {
  background: var(--blue-hover);
}

.history label {
  display: block;
  color: #475569;
  font-size: 13px;
  font-weight: 700;
  margin: 0 8px 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.history section {
  margin-bottom: 20px;
}

.history button {
  width: 100%;
  border: 0;
  background: transparent;
  color: #334155;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 10px 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
}

.history button:hover, .history button.active {
  color: var(--blue);
  background: #e5f0ff;
  font-weight: 600;
}

.history small {
  margin-left: auto;
  color: #64748b;
  font-size: 12px;
}

.chat {
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid #dfeaf5;
  border-left: 0;
  border-radius: 0 16px 16px 0;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 28px clamp(24px, 5vw, 64px) 14px;
}

.intro {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 0 24px;
}

.orb {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--blue);
  background: #e5f0ff;
  box-shadow: 0 0 0 8px rgba(229, 240, 255, 0.5);
  flex-shrink: 0;
}

.intro h2 {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 3px 0;
}

.intro p:last-child {
  color: var(--muted);
  font-size: 15px;
  margin: 0;
}

.retrieved {
  display: flex;
  align-items: center;
  gap: 8px;
  width: max-content;
  margin: 0 auto 24px;
  color: #1e3a5f;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 30px;
  background: #e3f8f1;
  border: 1px solid #bcead8;
  font-weight: 500;
}

.retrieved strong {
  color: #0f766e;
  font-weight: 700;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
}

.thread {
  display: grid;
  gap: 20px;
}

.empty {
  text-align: center;
  padding: 48px 24px;
  color: #64748b;
}

.empty .orb {
  width: 48px;
  height: 48px;
  margin: 0 auto 14px;
}

.empty b {
  display: block;
  font-size: 17px;
  color: #1e293b;
  margin-bottom: 6px;
}

.empty span {
  display: block;
  font-size: 15px;
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto;
}

.message {
  display: flex;
  gap: 14px;
  max-width: 84%;
}

.message.me {
  margin-left: auto;
  flex-direction: row-reverse;
}

.message-avatar {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--blue);
  background: #dfedff;
  font-weight: 700;
  font-size: 14px;
}

.me .message-avatar {
  color: white;
  background: var(--blue);
  border-radius: 50%;
}

.bubble {
  padding: 14px 18px;
  border: 1px solid #e0eaf4;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 6px 16px 16px 16px;
  box-shadow: 0 4px 16px rgba(50, 91, 130, 0.05);
}

.me .bubble {
  color: white;
  background: var(--blue);
  border-color: var(--blue);
  border-radius: 16px 6px 16px 16px;
}

.bubble small {
  color: #64748b;
  font-size: 13px;
  font-weight: 600;
}

.me .bubble small {
  color: #dbeafe;
}

.bubble p {
  line-height: 1.55;
  margin: 6px 0 0;
  font-size: 15px;
}

.citations {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #edf2f7;
}

.citations span {
  color: #334155;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 9px;
  border-radius: 6px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
}

.chat-footer {
  padding: 12px clamp(24px, 5vw, 64px) 18px;
  background: rgba(255, 255, 255, 0.5);
  border-top: 1px solid #e2e8f0;
}

.suggestions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.suggestions button {
  color: #1d4ed8;
  background: #eef5ff;
  border: 1px solid #bfdbfe;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}

.suggestions button:hover {
  background: #dbeafe;
  border-color: #93c5fd;
  transform: translateY(-1px);
}

.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 16px;
  height: 54px;
  background: #fff;
  border: 1px solid #cbd5e1;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(51, 92, 132, 0.08);
  transition: border-color 0.15s;
}

.composer:focus-within {
  border-color: var(--blue);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
}

.composer input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  font-size: 15px;
  color: var(--navy);
  height: 100%;
}

.send {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-size: 18px;
  display: grid;
  place-items: center;
  transition: background 0.15s;
  flex-shrink: 0;
}

.send:hover {
  background: var(--blue-hover);
}

.disclaimer {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin: 10px 0 0;
}

/* --- Search & Filters --- */
.search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(340px, 100%);
  height: 42px;
  padding: 0 14px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #cbd5e1;
  border-radius: 10px;
}

.search-field input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 15px;
  color: var(--navy);
}

.page-row .search-field {
  margin-right: auto;
}

.filters {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #e0eaf3;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.filters button {
  border: 0;
  background: transparent;
  color: #64748b;
  padding: 10px 14px 12px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: color 0.15s;
}

.filters button:hover {
  color: var(--blue);
}

.filters button.active {
  color: var(--blue);
  border-bottom: 2px solid var(--blue);
}

.filters i {
  margin-left: 6px;
  padding: 3px 6px;
  border-radius: 6px;
  background: #edf3f9;
  font-size: 11px;
  font-style: normal;
}

/* --- Memory Vault Grid & Detail --- */
.vault {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 20px;
}

.memory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.memory {
  min-height: 180px;
  padding: 18px;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #dce8f3;
  border-radius: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}

.memory:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.memory-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}

.memory h3 {
  font-size: 17px;
  font-weight: 600;
  margin: 14px 0 8px;
}

.memory p {
  color: #475569;
  line-height: 1.55;
  font-size: 14px;
  margin: 0;
}

.meta {
  color: #64748b;
  font-size: 12px;
  margin-top: 14px;
}

.detail {
  padding: 22px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid #dbe7f2;
  border-radius: 14px;
  box-shadow: var(--shadow);
  align-self: start;
}

.detail-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.detail h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 12px 0 6px;
}

.detail-copy {
  color: #334155;
  line-height: 1.6;
  font-size: 15px;
  margin: 16px 0 24px;
}

.detail-block {
  padding: 14px 0;
  border-top: 1px solid #e8eff5;
}

.detail-block label {
  color: #475569;
  font-size: 13px;
  font-weight: 700;
}

.source {
  padding-top: 10px;
  color: #334155;
  font-size: 14px;
}

.detail-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.detail-actions button {
  flex: 1;
}

/* --- Projects & Workspaces --- */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.project {
  overflow: hidden;
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #dce8f3;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}

.project:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}

.cover {
  height: 110px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: white;
}

.cover span {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.cover.blue { background: linear-gradient(135deg, #1656ad, #3b82f6); }
.cover.teal { background: linear-gradient(135deg, #0f766e, #14b8a6); }
.cover.sand { background: linear-gradient(135deg, #9a3412, #f97316); }

.project-body {
  padding: 18px;
}

.project h3 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;

<script>
// --- State & Variables ---
let memories = [];
let page = 'workspace', filter = 'All', selected = null;
let searchQuery = '';
let isLoadingMemories = false;
let memoriesError = null;
let isBackendOnline = false;
let currentConversationId = 'conv_' + Date.now();
let chatMessages = [];
let isSendingChat = false;
let relevantSourcesCount = 0;
let projectsData = null;
let isLoadingProjects = false;
let projectSearchQuery = '';
let projectStatusFilter = 'All';
let activeProjectId = null;
let activeProjectDetail = null;
let isLoadingProjectDetail = false;
let projectWorkspaceTab = 'overview';
let projectAiChatMessages = [];
let isSendingProjectAiChat = false;
let recentGlobalActivities = [];
let privacySettings = {
  enableMemory: true,
  autoCreation: true,
  reviewBeforeSaving: true
};

const meta = {
  workspace: ['AI Workspace', 'An AI that remembers what matters.'],
  memories: ['Memory Vault', 'Everything worth remembering.'],
  projects: ['Projects & Context', 'Track your projects and related memories.'],
  privacy: ['Privacy Center', 'Your data, your control.'],
  settings: ['Settings', 'Personalize your PrivateMind experience.']
};

function formatDate(isoStr) {
  if (!isoStr) return 'Recently';
  try {
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return 'Recently';
    return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
  } catch (e) {
    return 'Recently';
  }
}

function mapMemory(m) {
  return {
    id: m.id,
    title: m.title,
    text: m.content,
    content: m.content,
    category: m.category || 'General',
    source: m.source || 'manual',
    date: formatDate(m.updated_at || m.created_at),
    user_id: m.user_id,
    created_at: m.created_at,
    updated_at: m.updated_at
  };
}

function categoryClass(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('proj')) return 'blue';
  if (c.includes('pref')) return 'rose';
  if (c.includes('skill')) return 'violet';
  if (c.includes('import')) return 'amber';
  return 'teal';
}

function closeMobileDrawer() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sb) sb.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}

function toggleMobileDrawer() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sb && overlay) {
    const isOpen = sb.classList.toggle('open');
    overlay.classList.toggle('open', isOpen);
  }
}

function setPage(next) {
  page = next;
  closeMobileDrawer();
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('title').textContent = meta[page][0];
  document.getElementById('subtitle').textContent = meta[page][1];
  if (page === 'memories' && memories.length === 0 && !isLoadingMemories) {
    loadMemories();
  } else if (page === 'projects' && !projectsData && !isLoadingProjects) {
    loadProjects();
  }
  render();
}

async function checkBackendHealth() {
  const statusEl = document.getElementById('backendStatus');
  try {
    const res = await api.checkHealth();
    if (res.online) {
      isBackendOnline = true;
      if (statusEl) statusEl.innerHTML = '● Backend Connected (127.0.0.1:8000)';
    } else {
      isBackendOnline = false;

}

async function seedInitialMemories() {

  render();
  try {
    for (const item of initialSeed) {
      await api.createMemory(item);
    }
    sessionStorage.setItem('privatemind_seeded', 'true');
    await loadMemories();
  } catch (err) {

  } finally {

    render();
  }
}

async function loadMemories() {
  isLoadingMemories = true;
  memoriesError = null;
  render();

  try {
    const data = await api.getMemories({
      search: searchQuery.trim() || null,
      category: filter === 'All' ? null : filter
    });
    memories = data.map(mapMemory);

    // If SQLite is completely empty on fresh install, seed initial context once
    if (memories.length === 0 && filter === 'All' && !searchQuery.trim() && !sessionStorage.getItem('privatemind_seeded')) {
      sessionStorage.setItem('privatemind_seeded', 'true');
      for (const item of initialSeed) {
        await api.createMemory(item);
      }
      const fresh = await api.getMemories({});
      memories = fresh.map(mapMemory);
    }
  } catch (err) {
    memoriesError = err.message || 'Failed to load memories from backend API.';
  } finally {
    isLoadingMemories = false;
    render();
  }
}

function renderThreadMessages() {
  return chatMessages.map((msg, index) => {
    if (msg.role === 'me') {
      return `<div class="message me">
        <div class="message-avatar">R</div>
        <div class="bubble">
          <small>You</small>
          <p>${escapeHtml(msg.text)}</p>
        </div>
      </div>`;
    }

    let badge = '';
    if (msg.isError) {
      badge = `<span class="badge-tag badge-error">API Error</span>`;
    } else if (msg.isMock) {
      badge = `<span class="badge-tag badge-mock">Mock Provider (No API key)</span>`;
    } else if (msg.provider) {
      badge = `<span class="badge-tag badge-real">${escapeHtml(msg.provider)} · ${escapeHtml(msg.model || 'live')}</span>`;
    }

    let citationsHtml = '';
    if (msg.citations && msg.citations.length > 0) {
      citationsHtml = `<div class="citations">${msg.citations.map(c => `<span>▣ ${escapeHtml(c.title || 'Memory')}</span>`).join('')}</div>`;
    }

    let candidatesHtml = '';
    if (msg.candidates && msg.candidates.length > 0) {
      candidatesHtml = msg.candidates.map(cand => `
        <div class="candidate-box" id="cand_${cand.candidate_id}">

          <div class="candidate-actions">
            <button class="btn-sm btn-approve" data-approve="${cand.candidate_id}" data-msg-idx="${index}">Approve &amp; Save</button>
            <button class="btn-sm btn-reject" data-reject="${cand.candidate_id}" data-msg-idx="${index}">Reject</button>
          </div>
        </div>
      `).join('');
    }

    return `<div class="message">
      <div class="message-avatar"><svg width="16" height="16"><use href="#brain"/></svg></div>
      <div class="bubble">
        <small>PrivateMind ${badge}</small>

  }).join('');
}

async function send(text) {
  if (!text || !text.trim() || isSendingChat) return;
  const trimmed = text.trim();
  isSendingChat = true;

  // Add user message
  chatMessages.push({ role: 'me', text: trimmed });

  // Add assistant loading state
  const loadingIndex = chatMessages.push({
    role: 'assistant',
    text: '',
    loading: true
  }) - 1;

  renderChatThread();

  try {
    const res = await api.sendChat({
      message: trimmed,
      conversationId: currentConversationId,
      retrievalThreshold: 0.25,
      maxMemories: privacySettings.enableMemory ? 5 : 0
    });

    relevantSourcesCount = (res.memories_retrieved || []).length;
    chatMessages[loadingIndex] = {
      role: 'assistant',
      text: res.response,
      provider: res.provider,
      model: res.model,
      isMock: res.is_mock,
      citations: res.memories_retrieved || [],
      candidates: privacySettings.autoCreation ? (res.extracted_candidates || []) : [],
      loading: false
    };
  } catch (err) {
    chatMessages[loadingIndex] = {
      role: 'assistant',
      text: `Unable to complete chat request: ${err.message}. Backend running at http://127.0.0.1:8000?`,
      isError: true,
      loading: false
    };
  } finally {
    isSendingChat = false;
    renderChatThread();
  }
}

function renderChatThread() {
  const thread = document.getElementById('thread');
  const countEl = document.getElementById('retrievedSourcesCount');
  if (countEl) countEl.textContent = relevantSourcesCount > 0 ? `${relevantSourcesCount} sources` : 'Ready';
  if (thread) {
    thread.innerHTML = chatMessages.length === 0 ? `
      <div class="empty" id="empty">
        <div class="orb"><svg width="20" height="20"><use href="#sparkle"/></svg></div>
        <b>Start a conversation with your context in mind.</b>
        <span>Try a prompt below or ask anything. Your approved memories will appear alongside answers.</span>
      </div>
    ` : renderThreadMessages();
    bindChatEvents();
    const scrollEl = document.getElementById('chatScroll');
    if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
  }
}

function renderProjectChatMessages() {
  return projectAiChatMessages.map(msg => {
    if (msg.role === 'me') {
      return `<div class="message me">
        <div class="message-avatar">R</div>
        <div class="bubble">
          <small>You</small>
          <p>${escapeHtml(msg.text)}</p>
        </div>
      </div>`;
    }

    let citationsHtml = '';
    if (msg.citations && msg.citations.length > 0) {
      citationsHtml = `<div class="citations">${msg.citations.map(c => `<span>▣ ${escapeHtml(c.title || 'Context')}</span>`).join('')}</div>`;
    }

    let badge = msg.isError ? `<span class="badge-tag badge-error">Error</span>` :
      `<span class="badge-tag badge-real">${escapeHtml(msg.provider || 'local')}</span>`;

    return `<div class="message">
      <div class="message-avatar"><svg width="16" height="16"><use href="#brain"/></svg></div>
      <div class="bubble">
        <small>PrivateMind ${badge}</small>
        ${msg.loading ? `<p class="loading-dots">Grounded reasoning<span></span><span></span><span></span></p>` : `<p>${escapeHtml(msg.text)}</p>`}
        ${citationsHtml}
      </div>
    </div>`;
  }).join('');
}

function showAddMemoryModal() {
  const container = document.getElementById('modalContainer');
  container.innerHTML = `
    <div class="modal" id="addMemoryModal">
      <form id="addMemoryForm">
        <h2>Add to Memory Vault</h2>
        <label>Memory title</label>
        <input id="newMemTitle" placeholder="e.g. NVIDIA Hackathon Ideas" required>
        <label>Category</label>
        <select id="newMemCategory">
          <option value="Projects">Projects</option>
          <option value="Preferences">Preferences</option>
          <option value="Skills">Skills</option>
          <option value="Important">Important</option>
          <option value="Personal">Personal</option>
          <option value="General">General</option>
        </select>
        <label>What should PrivateMind remember?</label>
        <textarea id="newMemContent" rows="4" placeholder="Enter durable factual knowledge..." required></textarea>
        <div class="modal-actions">
          <button type="button" class="secondary" id="cancelAddMem">Cancel</button>
          <button type="submit" class="primary">Save memory</button>
        </div>
      </form>
    </div>
  `;
  document.getElementById('cancelAddMem').onclick = () => { container.innerHTML = ''; };
  document.getElementById('addMemoryForm').onsubmit = async (e) => {
    e.preventDefault();
    const title = document.getElementById('newMemTitle').value.trim();
    const category = document.getElementById('newMemCategory').value;
    const content = document.getElementById('newMemContent').value.trim();
    if (!title || !content) return;
    try {
      await api.createMemory({ title, content, category, source: 'manual' });
      container.innerHTML = '';
      await loadMemories();
    } catch (err) {
      alert('Error saving memory: ' + err.message);
    }
  };
}

// --- Render & Binding ---
function render() {
  document.getElementById('view').innerHTML =
    page === 'workspace' ? workspace() :
    page === 'memories' ? memoriesView() :
    page === 'projects' ? projects() :
    page === 'privacy' ? privacy() : settings();
  bind();
}

function bind() {
  // Mobile drawer bindings
  const mobileBtn = document.getElementById('mobileMenuBtn');
  if (mobileBtn) {
    mobileBtn.onclick = () => toggleMobileDrawer();
  }
  const overlay = document.getElementById('sidebarOverlay');
  if (overlay) {
    overlay.onclick = () => closeMobileDrawer();
  }

  // Navigation
  document.querySelectorAll('.nav button').forEach(b => {
    b.onclick = () => setPage(b.dataset.page);
  });

  // Workspace Chat Form
  const form = document.getElementById('chatForm');
  if (form) {
    form.onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      if (input) {
        send(input.value);
        input.value = '';
      }
    };
  }

  // Suggestions
  document.querySelectorAll('[data-prompt]').forEach(b => {
    b.onclick = () => {
      const input = document.getElementById('chatInput');
      if (input) {
        input.value = b.dataset.prompt;
        input.focus();
      }
    };
  });

  // New Chat Button
  const newChatBtn = document.getElementById('newChatBtn');
  if (newChatBtn) {
    newChatBtn.onclick = () => {
      currentConversationId = 'conv_' + Date.now();
      chatMessages = [];
      relevantSourcesCount = 0;
      render();
    };
  }

  // Bind candidate approvals in chat
  bindChatEvents();

  // Memory Vault
  document.querySelectorAll('[data-filter]').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.filter;
      loadMemories();
    };
  });

  document.querySelectorAll('[data-memory]').forEach(c => {
    c.onclick = () => {
      selected = memories.find(m => m.id == c.dataset.memory);
      render();
    };
  });

  document.querySelectorAll('[data-delete]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const id = b.dataset.delete;
      if (confirm('Permanently delete this memory from SQLite?')) {
        try {
          await api.deleteMemory(id);
          if (selected && selected.id == id) selected = null;
          await loadMemories();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
      }
    };
  });

  const close = document.getElementById('closeDetail');
  if (close) close.onclick = () => { selected = null; render(); };

  const editBtn = document.getElementById('detailEdit');
  if (editBtn && selected) editBtn.onclick = () => showEditMemoryModal(selected);

  const dd = document.getElementById('detailDelete');
  if (dd && selected) {
    dd.onclick = async () => {
      if (confirm('Permanently delete this memory from SQLite?')) {
        try {
          await api.deleteMemory(selected.id);
          selected = null;
          await loadMemories();
        } catch (err) {
          alert('Delete failed: ' + err.message);
        }
      }
    };
  }

  const add = document.getElementById('addMemory');
  if (add) add.onclick = () => showAddMemoryModal();

  const seedBtn = document.getElementById('seedDemoMemoriesBtn');
  if (seedBtn) seedBtn.onclick = () => seedInitialMemories();

  const retryMem = document.getElementById('retryMemories');
  if (retryMem) retryMem.onclick = () => loadMemories();

  const refreshMem = document.getElementById('refreshMemoriesBtn');
  if (refreshMem) refreshMem.onclick = () => { searchQuery = ''; loadMemories(); };

  const viewAll = document.getElementById('viewAll');
  if (viewAll) viewAll.onclick = () => { filter = 'All'; searchQuery = ''; loadMemories(); };

  // Memory search with debounce and focus restoration
  const search = document.getElementById('memorySearch');
  if (search) {
    let debounceTimer;
    search.oninput = () => {
      clearTimeout(debounceTimer);
      searchQuery = search.value;
      debounceTimer = setTimeout(async () => {
        try {
          const res = await api.getMemories({ search: searchQuery.trim() || null, category: filter === 'All' ? null : filter });
          memories = res.map(mapMemory);
          render();
          const s = document.getElementById('memorySearch');
          if (s) {
            s.focus();
            s.setSelectionRange(s.value.length, s.value.length);
          }
        } catch (err) {
          console.error('Search error:', err);
        }
      }, 250);
    };
  }

  // Saved Topics in Workspace sidebar
  document.querySelectorAll('[data-topic]').forEach(b => {
    b.onclick = () => {
      const topic = b.dataset.topic;
      currentConversationId = 'conv_' + topic.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      const input = document.getElementById('chatInput');
      if (input) {
        input.value = `Tell me what you remember about: ${topic}`;
        input.focus();
      }
    };
  });

  // Projects Grid & Search Bindings
  const newProj = document.getElementById('newProjectBtn');
  if (newProj) newProj.onclick = () => showNewProjectModal();

  const emptyNewProj = document.getElementById('emptyNewProjectBtn');
  if (emptyNewProj) emptyNewProj.onclick = () => showNewProjectModal();

  // Project search with debounce
  const projSearchInput = document.getElementById('projectSearchInput');
  if (projSearchInput) {
    let projSearchDebounce;
    projSearchInput.oninput = () => {
      clearTimeout(projSearchDebounce);
      projectSearchQuery = projSearchInput.value;
      projSearchDebounce = setTimeout(async () => {
        await loadProjects();
        const inp = document.getElementById('projectSearchInput');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      }, 250);
    };
  }

  // Project status filter buttons
  document.querySelectorAll('[data-pfilter]').forEach(b => {
    b.onclick = () => {
      projectStatusFilter = b.dataset.pfilter;
      loadProjects();
    };
  });

  // Project card click -> open workspace
  document.querySelectorAll('.project[data-project-id]').forEach(card => {
    card.onclick = () => {
      const pid = card.dataset.projectId;
      openProjectWorkspace(pid);
    };
  });

  // Workspace Navigation & Header Buttons
  const backBtn = document.getElementById('backToProjectsBtn');
  if (backBtn) backBtn.onclick = () => closeProjectWorkspace();

  document.querySelectorAll('[data-wtab]').forEach(b => {
    b.onclick = () => setProjectTab(b.dataset.wtab);
  });

  const editProjBtn = document.getElementById('editProjectBtn');
  if (editProjBtn && activeProjectDetail && activeProjectDetail.project) {
    editProjBtn.onclick = () => showEditProjectModal(activeProjectDetail.project);
  }

  const deleteProjBtn = document.getElementById('deleteProjectBtn');
  if (deleteProjBtn && activeProjectId) {
    deleteProjBtn.onclick = async () => {
      if (confirm(`Permanently delete project "${activeProjectDetail.project.title}"?\n\nNote: Unrelated memories in your vault will NOT be deleted.`)) {
        try {
          await api.deleteProject(activeProjectId);
          closeProjectWorkspace();
        } catch (err) {
          alert('Failed to delete project: ' + err.message);
        }
      }
    };
  }

  const askAiTopBtn = document.getElementById('askAiProjectTopBtn');
  if (askAiTopBtn) {
    askAiTopBtn.onclick = () => {
      setProjectTab('ask_ai');
      const inp = document.getElementById('projectChatInput');
      if (inp) inp.focus();
    };
  }

  // Notes actions
  const addNoteBtn = document.getElementById('addNoteBtn') || document.getElementById('emptyAddNoteBtn') || document.getElementById('quickAddNoteBtn');
  if (addNoteBtn && activeProjectId) {
    addNoteBtn.onclick = () => showNewNoteModal(activeProjectId);
  }

  document.querySelectorAll('[data-edit-note]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const nId = parseInt(b.dataset.editNote, 10);
      const note = (activeProjectDetail.notes || []).find(n => n.id === nId);
      if (note) showEditNoteModal(activeProjectId, note);
    };
  });

  document.querySelectorAll('[data-delete-note]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const nId = parseInt(b.dataset.deleteNote, 10);
      if (confirm('Delete this project note?')) {
        try {
          await api.deleteProjectNote(activeProjectId, nId);
          await reloadActiveProject();
        } catch (err) {
          alert('Failed to delete note: ' + err.message);
        }
      }
    };
  });

  document.querySelectorAll('[data-promote-note]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const nId = parseInt(b.dataset.promoteNote, 10);
      try {
        b.textContent = 'Saving to Vault...';
        b.disabled = true;
        await api.convertNoteToMemory(activeProjectId, nId);
        alert('✓ Note successfully promoted to persistent memory and indexed in FAISS vector store!');
        await reloadActiveProject();
        await loadMemories();
      } catch (err) {
        alert('Failed to promote note: ' + err.message);
        b.textContent = '★ Promote to Memory';
        b.disabled = false;
      }
    };
  });

  // Tasks actions
  const addTaskBtn = document.getElementById('addTaskBtn') || document.getElementById('emptyAddTaskBtn') || document.getElementById('quickAddTaskBtn');
  if (addTaskBtn && activeProjectId) {
    addTaskBtn.onclick = () => showNewTaskModal(activeProjectId);
  }

  document.querySelectorAll('.task-check').forEach(chk => {
    chk.onchange = async () => {
      const tId = parseInt(chk.dataset.taskId, 10);
      const newStatus = chk.checked ? 'completed' : 'todo';
      try {
        await api.updateProjectTask(activeProjectId, tId, { status: newStatus });
        await reloadActiveProject();
        await loadProjects();
      } catch (err) {
        alert('Failed to update task status: ' + err.message);
        chk.checked = !chk.checked;
      }
    };
  });

  document.querySelectorAll('[data-edit-task]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const tId = parseInt(b.dataset.editTask, 10);
      const task = (activeProjectDetail.tasks || []).find(t => t.id === tId);
      if (task) showEditTaskModal(activeProjectId, task);
    };
  });

  document.querySelectorAll('[data-delete-task]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const tId = parseInt(b.dataset.deleteTask, 10);
      if (confirm('Delete this task?')) {
        try {
          await api.deleteProjectTask(activeProjectId, tId);
          await reloadActiveProject();
          await loadProjects();
        } catch (err) {
          alert('Failed to delete task: ' + err.message);
        }
      }
    };
  });

  // Memories actions
  const attachMemBtn = document.getElementById('attachMemoryBtn') || document.getElementById('emptyAttachMemoryBtn') || document.getElementById('quickAttachMemBtn');
  if (attachMemBtn && activeProjectId) {
    attachMemBtn.onclick = () => showAttachMemoryModal(activeProjectId);
  }

  document.querySelectorAll('[data-detach-mem]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const mId = parseInt(b.dataset.detachMem, 10);
      if (confirm('Detach this memory from this project?\n\nNote: The memory will remain safely in your Memory Vault.')) {
        try {
          await api.detachMemoryFromProject(activeProjectId, mId);
          await reloadActiveProject();
          await loadProjects();
        } catch (err) {
          alert('Failed to detach memory: ' + err.message);
        }
      }
    };
  });

  // Project AI Chat Form
  const projChatForm = document.getElementById('projectChatForm');
  if (projChatForm && activeProjectId) {
    projChatForm.onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('projectChatInput');
      if (!input || !input.value.trim() || isSendingProjectAiChat) return;
      const text = input.value.trim();
      input.value = '';
      isSendingProjectAiChat = true;

      projectAiChatMessages.push({ role: 'me', text });
      const loadingIdx = projectAiChatMessages.push({
        role: 'assistant',
        text: '',
        loading: true
      }) - 1;
      render();

      try {
        const res = await api.askAIAboutProject(activeProjectId, {
          message: text,
          conversationId: 'proj_' + activeProjectId
        });
        projectAiChatMessages[loadingIdx] = {
          role: 'assistant',
          text: res.response,
          provider: res.provider,
          model: res.model,
          citations: res.memories_retrieved || [],
          loading: false
        };
      } catch (err) {
        projectAiChatMessages[loadingIdx] = {
          role: 'assistant',
          text: 'Failed to complete project AI request: ' + err.message,
          isError: true,
          loading: false
        };
      } finally {
        isSendingProjectAiChat = false;
        render();
        const threadEl = document.getElementById('projectChatThread');
        if (threadEl) threadEl.scrollTop = threadEl.scrollHeight;
      }
    };
  }

  const clearProjChat = document.getElementById('clearProjectChatBtn');
  if (clearProjChat) {
    clearProjChat.onclick = () => {
      projectAiChatMessages = [];
      render();
    };
  }

  document.querySelectorAll('[data-proj-prompt]').forEach(b => {
    b.onclick = () => {
      const input = document.getElementById('projectChatInput');
      if (input) {
        input.value = b.dataset.projPrompt;
        input.focus();
      }
    };
  });


  // Privacy Center
  document.querySelectorAll('[data-setting]').forEach(b => {
    b.onclick = async () => {
      const setting = b.dataset.setting;
      privacySettings[setting] = !privacySettings[setting];
      b.classList.toggle('on', privacySettings[setting]);
      try {
        await api.updateSettings({
          memory_enabled: privacySettings.enableMemory,
          auto_extraction: privacySettings.autoCreation,
          review_before_save: privacySettings.reviewBeforeSaving,
        });
      } catch (err) {
        console.warn('Failed to sync privacy setting with backend:', err.message);
      }
    };
  });

  const privMem = document.getElementById('privacyViewMemories');
  if (privMem) privMem.onclick = () => setPage('memories');

  const privExport = document.getElementById('privacyExportData');
  if (privExport) {
    privExport.onclick = async () => {
      try {
        const exportData = await api.exportData();
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `privatemind_export_${exportData.user_id || 'user'}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Export error: ' + err.message);
      }
    };
  }

  const privDelAll = document.getElementById('privacyDeleteAll');
  if (privDelAll) {
    privDelAll.onclick = async () => {
      if (confirm('WARNING: Are you sure you want to permanently delete ALL memories and conversation data? This cannot be undone.')) {
        try {
          await api.deleteAllMemories();
          selected = null;
          searchQuery = '';
          sessionStorage.setItem('privatemind_seeded', 'true');
          await loadMemories();
          alert('All memories and embeddings permanently deleted from SQLite database and FAISS index.');
        } catch (err) {
          alert('Deletion error: ' + err.message);
        }
      }
    };
  }

  // Settings
  const saveUrlBtn = document.getElementById('saveApiBaseUrlBtn');
  if (saveUrlBtn) {
    saveUrlBtn.onclick = () => {
      const input = document.getElementById('apiBaseUrlInput');
      if (input && input.value) {
        api.setBaseUrl(input.value.trim());
        checkBackendHealth();
        alert('API Base URL updated to ' + api.config.baseUrl);
      }
    };
  }

  const editProfile = document.getElementById('editProfileBtn');
  if (editProfile) {
    editProfile.onclick = () => {
      const name = prompt('Update Profile Name:', 'Roeith R');
      if (name) alert(`Profile updated to ${name}!`);
    };
  }
}

function bindChatEvents() {
  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.onclick = async () => {
      const candId = btn.dataset.approve;
      const msgIdx = parseInt(btn.dataset.msgIdx, 10);
      const msg = chatMessages[msgIdx];
      if (!msg || !msg.candidates) return;
      const candidate = msg.candidates.find(c => c.candidate_id === candId);
      if (!candidate) return;

      try {
        btn.textContent = 'Saving...';
        btn.disabled = true;
        await api.approveMemories({ candidates: [candidate] });
        const box = document.getElementById('cand_' + candId);
        if (box) {
          box.innerHTML = `<span style="color:#168064;font-weight:bold">✓ Memory saved to SQLite Vault!</span>`;
        }
        await loadMemories();
      } catch (err) {
        alert('Failed to approve memory: ' + err.message);
        btn.textContent = 'Approve & Save';
        btn.disabled = false;
      }
    };
  });

  document.querySelectorAll('[data-reject]').forEach(btn => {
    btn.onclick = async () => {
      const candId = btn.dataset.reject;
      try {
        await api.rejectMemories({ candidateIds: [candId] });
        const box = document.getElementById('cand_' + candId);
        if (box) box.remove();
      } catch (err) {
        alert('Failed to reject candidate: ' + err.message);
      }
    };
  });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// Initial Boot
async function init() {
  await checkBackendHealth();
  try {
    const me = await api.getMe();
    if (me) {
      privacySettings.enableMemory = me.memory_enabled !== false;
      privacySettings.autoCreation = me.auto_extraction !== false;
      privacySettings.reviewBeforeSaving = me.review_before_save !== false;
    }
  } catch (e) {
    console.debug('Using default user settings');
  }
  await loadMemories();
}

init();
</script>
</body>
</html>
