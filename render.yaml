services:
  # Backend Web Service (FastAPI)
  - type: web
    name: privatemind-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: nebius
      - key: LLM_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: LLM_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: DATABASE_URL
        value: sqlite:///./data/privatemind.db
      - key: NEBIUS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://privatemind-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: privatemind-frontend
    env: static
    plan: free
    rootDir: frontend
    staticPublishPath: .
    buildCommand: ""
